<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Avanthi E-Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">
    <nav class="glass sticky top-0 z-50 px-8 py-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-cyan-500 flex items-center justify-center font-black text-slate-950 text-lg">A</div>
            <div>
                <h1 class="font-bold text-sm tracking-wider">AVANTHI <span class="text-cyan-400">E-VOTING SYSTEM</span></h1>
                <p class="text-[9px] text-slate-400">Guide: Mrs. K. JYOTHI, B.Tech[span_2](start_span)[span_2](end_span)</p>
            </div>
        </div>
        <a href="index.html" class="px-3 py-1.5 bg-slate-900 rounded-xl text-xs font-bold text-slate-300 border border-slate-700">Login</a>
    </nav>

    <main class="max-w-md mx-auto px-4 py-12 flex-grow flex items-center w-full">
        <div class="glass w-full p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-black text-white text-center mb-1">Student Enrollment</h2>
            <p class="text-xs text-slate-400 text-center mb-6">Register your institutional roll number</p>
            
            <form onsubmit="handleRegister(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-300 uppercase mb-1">Roll Number (Format: 24597-CM-029)</label>
                    <input type="text" id="regRoll" placeholder="Ex: 24597-CM-029" required 
                        class="w-full p-3.5 bg-slate-900 rounded-xl border border-slate-700 uppercase font-mono text-white focus:border-emerald-400 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-300 uppercase mb-1">Create Password</label>
                    <input type="password" id="regPass" placeholder="••••••••" required 
                        class="w-full p-3.5 bg-slate-900 rounded-xl border border-slate-700 text-white focus:border-emerald-400 outline-none">
                </div>
                <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black uppercase tracking-wider rounded-xl shadow-lg transition">COMPLETE ENROLLMENT</button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs">
                <a href="index.html" class="text-cyan-400 font-bold hover:underline">← Back to Portal Login</a>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-900">&copy; 2026 Avanthi E-Voting System</footer>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const roll = document.getElementById('regRoll').value.toUpperCase().trim();
            const pass = document.getElementById('regPass').value;
            
            if(!/^\d{5}-[A-Z]{2,3}-\d{3}$/.test(roll)) {
                return alert("Invalid Roll Number Format! Use Ex: 24597-CM-029");
            }

            let users = JSON.parse(localStorage.getItem('users')) || {};
            if(users[roll]) return alert("Roll Number already registered!");
            
            users[roll] = pass;
            localStorage.setItem('users', JSON.stringify(users));
            alert("Registration Successful! Please login.");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
