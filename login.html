<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Login - Avanthi E-Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
        <div>
            <h2 class="text-2xl font-bold text-emerald-400">Voter Portal Login</h2>
            <p class="text-slate-400 text-xs mt-1">Enter registered roll number to enter ballot.</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Roll Number</label>
                <input type="text" id="loginRoll" required placeholder="e.g. 24597-cm-054" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white font-mono focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 rounded-lg text-sm transition">
                Proceed to Voting Booth &rarr;
            </button>
            <p id="loginMsg" class="text-xs text-center hidden"></p>
        </form>

        <div class="text-center">
            <a href="index.html" class="text-xs text-slate-400 hover:underline">&larr; Back to Home</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const roll = document.getElementById('loginRoll').value.replace(/\s+/g, '').toLowerCase();
            const msg = document.getElementById('loginMsg');

            const voters = JSON.parse(localStorage.getItem('avanthi_voters')) || {};
            
            // Check if student registered
            if (!voters[roll]) {
                msg.textContent = "Roll number not registered yet! Please register first.";
                msg.className = "text-xs text-center text-red-400 font-semibold";
                msg.classList.remove('hidden');
                return;
            }

            // Check if student already voted
            const votedList = JSON.parse(localStorage.getItem('avanthi_voted_list')) || [];
            if (votedList.includes(roll)) {
                msg.textContent = "You have already cast your vote!";
                msg.className = "text-xs text-center text-amber-400 font-semibold";
                msg.classList.remove('hidden');
                return;
            }

            // Save active session & open voting booth
            sessionStorage.setItem('currentVoter', roll);
            msg.textContent = "Verification Successful! Opening ballot...";
            msg.className = "text-xs text-center text-emerald-400 font-semibold";
            msg.classList.remove('hidden');
            setTimeout(() => location.href = 'voting.html', 1000);
        }
    </script>
</body>
</html>
