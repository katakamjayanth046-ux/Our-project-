<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Analytics & Receipts - Avanthi E-Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 p-6 font-sans min-h-screen flex flex-col justify-between">
    <div class="max-w-2xl mx-auto w-full space-y-6 flex-grow">
        
        <div class="glass p-6 rounded-3xl flex justify-between items-center border border-slate-800 text-xs">
            <div>
                <h1 class="text-base font-black text-white"><i class="fa-solid fa-chart-pie text-emerald-400 mr-2"></i> Live Analytics & Receipt Portal</h1>
                <p class="text-slate-400">Guide: Mrs. K. JYOTHI, B.Tech[span_23](start_span)[span_23](end_span)</p>
            </div>
            <a href="index.html" class="px-4 py-2 bg-slate-800 rounded-xl font-bold text-slate-300">Home</a>
        </div>

        <!-- Receipt Verification Search Bar -->
        <div class="glass p-6 rounded-3xl space-y-3 text-xs">
            <h3 class="font-black text-cyan-400 uppercase"><i class="fa-solid fa-receipt mr-1"></i> Verify Your Voting Receipt ID</h3>
            <div class="flex gap-2">
                <input type="text" id="searchReceipt" placeholder="Enter Receipt ID (Ex: TXN-AVN-XXXX)" class="flex-grow p-3 bg-slate-900 border border-slate-700 rounded-xl text-white uppercase font-mono">
                <button onclick="verifyReceipt()" class="px-5 py-3 bg-cyan-600 font-black rounded-xl text-slate-950 uppercase">Verify</button>
            </div>
            <p id="receiptResult" class="font-bold text-emerald-400"></p>
        </div>

        <!-- Chart Container -->
        <div class="glass p-6 rounded-3xl space-y-4">
            <h3 class="font-black text-white uppercase text-sm">Election Vote Share Graph</h3>
            <div class="w-full h-64 bg-slate-900 p-4 rounded-2xl flex items-center justify-center">
                <canvas id="voteChart"></canvas>
            </div>
        </div>

        <div id="resContainer" class="space-y-4 text-xs"></div>
    </div>

    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-900">&copy; 2026 Avanthi E-Voting System</footer>

    <script>
        const timeData = JSON.parse(localStorage.getItem('eTime')) || { title: "Avanthi General Election 2026", endTime: "2030-12-31T23:59" };
        const container = document.getElementById('resContainer');

        let candidates = JSON.parse(localStorage.getItem('cands')) || [];
        candidates.push({name: "NOTA", party: "None Of The Above"});
        const votes = JSON.parse(localStorage.getItem('votes')) || {};

        let sorted = candidates.map(c => ({ name: c.name, party: c.party || 'None', count: votes[c.name] || 0 }))
                               .sort((a,b) => b.count - a.count);
        const total = sorted.reduce((sum, c) => sum + c.count, 0);

        const ctx = document.getElementById('voteChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sorted.map(c => c.name),
                datasets: [{
                    label: 'Votes Received',
                    data: sorted.map(c => c.count),
                    backgroundColor: ['#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#6366f1'],
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                }
            }
        });

        let html = `
            <div class="glass p-6 rounded-3xl border border-slate-800 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="font-black text-white uppercase text-sm">${timeData.title}</h3>
                    <span class="text-cyan-400 font-bold">${total} Total Ballots Cast</span>
                </div>
                <div class="space-y-3">`;

        sorted.forEach((c, idx) => {
            const pct = total > 0 ? Math.round((c.count / total) * 100) : 0;
            const isWinner = idx === 0 && c.count > 0 && c.name !== "NOTA";

            html += `
                <div class="bg-slate-900 p-4 rounded-2xl border ${isWinner ? 'border-emerald-500/50' : 'border-slate-800'} relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 bg-cyan-500/10 transition-all duration-1000" style="width: ${pct}%"></div>
                    <div class="relative z-10 flex justify-between items-center text-white">
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-black text-sm">${c.name}</h4>
                                ${isWinner ? '<span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-[9px] font-bold">WINNER</span>' : ''}
                            </div>
                            <p class="text-slate-400">${c.party} &bull; ${pct}%</p>
                        </div>
                        <span class="text-xl font-black">${c.count}</span>
                    </div>
                </div>`;
        });

        container.innerHTML = html + `</div></div>`;

        function verifyReceipt() {
            let id = document.getElementById('searchReceipt').value.toUpperCase().trim();
            let receipts = JSON.parse(localStorage.getItem('receipts')) || {};
            let found = Object.entries(receipts).find(([roll, txn]) => txn === id);
            let resBox = document.getElementById('receiptResult');
            if(found) {
                resBox.className = "font-bold text-emerald-400 mt-2";
                resBox.innerText = `✓ Valid Cryptographic Receipt! Voter Roll [${found[0]}] ballot securely recorded.`;
            } else {
                resBox.className = "font-bold text-rose-400 mt-2";
                resBox.innerText = `✕ Invalid or Unregistered Receipt ID!`;
            }
        }
    </script>
</body>
</html>
