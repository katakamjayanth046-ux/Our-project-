<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Results & Verification - Avanthi E-Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Election Live Results & Verification</h1>
                <p class="text-xs text-slate-400 mt-0.5">Avanthi Institute Student Elections</p>
            </div>
            <a href="./index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">Home</a>
        </header>

        <!-- Official Winner Announcement Banner -->
        <div id="winnerBanner" class="hidden bg-gradient-to-r from-emerald-900/50 to-blue-900/50 border border-emerald-500/50 p-6 rounded-2xl shadow-xl text-center space-y-2">
            <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Official Winner Announcement</span>
            <h2 id="winnerText" class="text-2xl font-extrabold text-white"></h2>
            <p id="winnerSubText" class="text-xs text-slate-300"></p>
        </div>

        <!-- Receipt Verification Section -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-blue-400">🔍 Verify Vote Receipt ID</h2>
            <p class="text-xs text-slate-400">Paste your transaction receipt ID below to check if your vote was successfully cast and recorded.</p>
            <div class="flex gap-2">
                <input type="text" id="receiptInput" placeholder="Enter Receipt ID (e.g. TXN-AVN-XXXXXX)" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white font-mono uppercase focus:outline-none focus:border-blue-500">
                <button onclick="verifyReceipt()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl text-sm font-semibold transition">Verify</button>
            </div>
            <div id="receiptResult" class="hidden p-3 rounded-xl text-xs font-medium"></div>
        </div>

        <!-- Live Vote Tally -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-slate-200">📊 Live Vote Tally</h2>
            <div id="resultsList" class="space-y-4"></div>
            <div class="flex justify-between items-center p-3 bg-slate-800/40 rounded-xl border border-slate-800 text-sm">
                <span class="font-semibold text-slate-300">NOTA (None of the Above)</span>
                <span id="notaCount" class="font-mono font-bold text-amber-400">0 Votes</span>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadResults();
            checkElectionStatus();
        };

        function loadResults() {
            const list = document.getElementById('resultsList');
            let candidates = JSON.parse(localStorage.getItem('avanthi_candidates')) || [];
            let notaVotes = parseInt(localStorage.getItem('avanthi_nota_votes') || '0', 10);
            document.getElementById('notaCount').textContent = notaVotes + ' Votes';

            let totalVotes = notaVotes;
            candidates.forEach(c => totalVotes += (c.votes || 0));

            if (candidates.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">No candidates registered.</p>';
                return;
            }

            candidates.sort((a, b) => (b.votes || 0) - (a.votes || 0));

            list.innerHTML = candidates.map(c => {
                const v = c.votes || 0;
                const pct = totalVotes > 0 ? Math.round((v / totalVotes) * 100) : 0;
                return `
                    <div class="space-y-1.5 bg-slate-800/40 p-4 rounded-xl border border-slate-800">
                        <div class="flex justify-between items-center text-sm">
                            <span class="font-bold text-white">${c.name} <span class="text-xs text-blue-400 font-normal">(${c.dept})</span></span>
                            <span class="font-mono font-semibold text-emerald-400">${v} Votes (${pct}%)</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function verifyReceipt() {
            const rid = document.getElementById('receiptInput').value.trim().toUpperCase();
            const resBox = document.getElementById('receiptResult');
            if (!rid) {
                resBox.textContent = "Please enter a valid Receipt ID.";
                resBox.className = "p-3 rounded-xl text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30";
                resBox.classList.remove('hidden');
                return;
            }

            const voterRoll = localStorage.getItem('receipt_map_' + rid);
            if (voterRoll) {
                resBox.textContent = `✓ Valid Receipt! Vote successfully cast and recorded for roll number: ${voterRoll.toUpperCase()}`;
                resBox.className = "p-3 rounded-xl text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            } else {
                resBox.textContent = "✗ Invalid Receipt ID or vote record not found in ledger.";
                resBox.className = "p-3 rounded-xl text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30";
            }
            resBox.classList.remove('hidden');
        }

        function checkElectionStatus() {
            const endTimeStr = localStorage.getItem('avanthi_end_time');
            const now = new Date();
            let isEnded = false;

            if (endTimeStr) {
                const endTime = new Date(endTimeStr);
                if (now >= endTime) isEnded = true;
            }

            let candidates = JSON.parse(localStorage.getItem('avanthi_candidates')) || [];
            if (candidates.length > 0 && (isEnded || totalVotesCast() > 0)) {
                candidates.sort((a, b) => (b.votes || 0) - (a.votes || 0));
                const winner = candidates[0];
                if (winner && (winner.votes || 0) > 0) {
                    document.getElementById('winnerBanner').classList.remove('hidden');
                    document.getElementById('winnerText').textContent = `🎉 Winner: ${winner.name} (${winner.dept})`;
                    document.getElementById('winnerSubText').textContent = `Secured majority with ${winner.votes} votes! Official election results declared.`;
                }
            }
        }

        function totalVotesCast() {
            let candidates = JSON.parse(localStorage.getItem('avanthi_candidates')) || [];
            let nota = parseInt(localStorage.getItem('avanthi_nota_votes') || '0', 10);
            return nota + candidates.reduce((sum, c) => sum + (c.votes || 0), 0);
        }
    </script>
</body>
</html>
